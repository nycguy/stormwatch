name: Test and deploy StormWatch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required application files
        run: |
          test -f index.html
          test -f css/app.css
          test -f js/app.js
          test -f js/location.js
          test -f js/nws.js
          grep -q "api.weather.gov" js/config.js
          grep -q "countrycodes=us" js/location.js
          grep -q "nearestGauge" js/marine.js
          grep -q "nearestBuoy" js/marine.js
          grep -q "StormHazards" js/hazards.js
      - name: JavaScript syntax checks
        run: |
          for f in js/*.js tests/*.js; do node --check "$f"; done
      - name: Deterministic unit tests
        run: node tests/unit.js
      - name: Cloudflare history implementation tests
        run: node tests/cloudflare-history.js
      - name: History API reference tests
        run: node tests/history-api.js
      - name: Browser and mobile contract tests
        run: node tests/browser-contract.js
      - name: Cross-module integration contracts
        run: node tests/integration-contract.js
      - name: Production intelligence regression tests
        run: node tests/production-intelligence.js
      - name: Live public-source smoke tests
        continue-on-error: true
        run: node tests/network-smoke.js
      - name: Nationwide architecture guards
        run: |
          grep -q "locationKey" js/history.js
          grep -q "forecastHourly" js/nws.js
          grep -q "forecastGridData" js/nws.js
          grep -q "eventPanel" index.html
          grep -q "StormNHC" js/nhc.js
          grep -q "StormEvent" js/event.js
          test -f scripts/capture-history.js
          test -f manifest.webmanifest
          test -f sw.js
          grep -q "StormLifecycle" js/lifecycle.js
          grep -q "StormSaved" js/saved.js
          grep -q "StormSourceHealth" js/source-health.js
          grep -q "StormForecastChange" js/forecast-change.js
          grep -q "residual" js/marine.js
          grep -q "StormCoastal" js/coastal.js
          grep -q "StormRadar" js/radar.js
          grep -q "nws-alert-fill" js/map.js
          grep -q "comparisons" js/history.js
          grep -q "StormTiming" js/timing.js
          grep -q "forecastPeak" js/marine.js
          grep -q "regionalAt" js/shared-history.js
          grep -q "coastal" scripts/capture-history.js
          grep -q "tracked-locations" scripts/capture-history.js
          grep -q "StormImpact" js/impact.js
          grep -q "StormHourly" js/hourly.js
          grep -q "floodlevels.json" js/coastal.js
          grep -q "durationMs" js/event.js
          grep -q "StormWebcams" js/webcams.js
          test -f data/tracked-locations.json
          grep -q "historyApi" js/config.js
          grep -q "StormPersistence" js/persistence.js
          test -f docs/HISTORY_API.md
          test -f server/history-api-reference.js
          test -f worker/history-worker.js
          test -f worker/schema.sql
          test -f wrangler.toml
          grep -q "scheduled" worker/history-worker.js
          grep -q "snapshots" worker/schema.sql
          test -f docs/CLOUDFLARE_HISTORY.md
      - name: Guard against Saco-specific production hard coding
        run: |
          ! grep -RniE "8418150|44007|WEXM1|Saco Bay|Portland, Maine" index.html js css
  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
