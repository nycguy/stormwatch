name: Test and deploy StormWatch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required application files
        run: |
          test -f index.html
          test -f css/app.css
          test -f js/app.js
          test -f js/location.js
          test -f js/nws.js
          grep -q "api.weather.gov" js/config.js
          grep -q "countrycodes=us" js/location.js
      - name: Guard against Saco-specific production hard coding
        run: |
          ! grep -RniE "8418150|44007|WEXM1|Saco Bay|Portland, Maine" index.html js css
  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
